<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let Me Glean That For You</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f6f8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #1a1a2e;
  }
  #create-view, #animate-view { width: 100%; max-width: 640px; padding: 2rem; text-align: center; }
  .logo { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.3rem; color: #1a1a2e; }
  .logo span { color: #6C5CE7; }
  .subtitle { font-size: 0.95rem; color: #666; margin-bottom: 2.5rem; }
  .search-box-wrapper { position: relative; width: 100%; margin-bottom: 1.5rem; }
  .search-box { width: 100%; padding: 14px 48px 14px 44px; font-size: 1rem; border: 2px solid #ddd; border-radius: 12px; outline: none; background: #fff; transition: border-color 0.2s; }
  .search-box:focus { border-color: #6C5CE7; }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; opacity: 0.4; }
  .btn-primary { background: #6C5CE7; color: #fff; border: none; padding: 12px 32px; font-size: 1rem; font-weight: 600; border-radius: 10px; cursor: pointer; transition: background 0.2s, transform 0.1s; }
  .btn-primary:hover { background: #5a4bd1; }
  .btn-primary:active { transform: scale(0.97); }
  #link-output { display: none; margin-top: 2rem; text-align: center; }
  #link-output .label { font-size: 0.85rem; color: #888; margin-bottom: 0.5rem; }
  #generated-link { width: 100%; padding: 12px 14px; font-size: 0.9rem; border: 2px solid #6C5CE7; border-radius: 10px; background: #f0edfc; color: #333; text-align: center; outline: none; cursor: text; }
  .copy-row { display: flex; gap: 0.5rem; margin-top: 0.75rem; justify-content: center; }
  .btn-copy { background: #6C5CE7; color: #fff; border: none; padding: 8px 20px; font-size: 0.85rem; font-weight: 600; border-radius: 8px; cursor: pointer; }
  .btn-copy:hover { background: #5a4bd1; }
  .copied-toast { display: none; font-size: 0.85rem; color: #27ae60; font-weight: 600; align-self: center; }
  #animate-view { display: none; }
  .anim-search-box { width: 100%; padding: 14px 48px 14px 44px; font-size: 1rem; border: 2px solid #ddd; border-radius: 12px; background: #fff; text-align: left; outline: none; caret-color: #6C5CE7; }
  .anim-search-box.typing { border-color: #6C5CE7; }
  #cursor-blink { display: inline-block; width: 2px; height: 1.1em; background: #6C5CE7; margin-left: 1px; vertical-align: text-bottom; animation: blink 0.7s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .anim-btn { margin-top: 1.5rem; background: #6C5CE7; color: #fff; border: none; padding: 12px 32px; font-size: 1rem; font-weight: 600; border-radius: 10px; cursor: default; opacity: 0.7; transition: opacity 0.3s, transform 0.15s; }
  .anim-btn.active { opacity: 1; animation: clickPulse 0.35s ease; }
  @keyframes clickPulse { 0% { transform: scale(1); } 40% { transform: scale(0.93); } 100% { transform: scale(1); } }
  #fake-cursor { display: none; position: fixed; width: 24px; height: 24px; z-index: 9999; pointer-events: none; transition: left 0.6s ease-in-out, top 0.6s ease-in-out; }
  #snark { display: none; margin-top: 2rem; padding: 16px 28px; background: #fff3cd; border: 2px solid #f0c36d; border-radius: 12px; font-size: 1.15rem; font-weight: 600; color: #856404; animation: fadeUp 0.5s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .footer { position: fixed; bottom: 1rem; font-size: 0.75rem; color: #aaa; }
</style>
</head>
<body>
<div id="create-view">
  <div class="logo">Let Me <span>Glean</span> That For You</div>
  <p class="subtitle">For all those people who find it more convenient to bother you than to search Glean themselves.</p>
  <div class="search-box-wrapper">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-box" id="query-input" type="text" placeholder="Type a Glean search query..." autocomplete="off" />
  </div>
  <button class="btn-primary" id="generate-btn">Generate Link</button>
  <div id="link-output">
    <p class="label">Share this link with your colleague:</p>
    <input id="generated-link" type="text" readonly />
    <div class="copy-row">
      <button class="btn-copy" id="copy-btn">Copy Link</button>
      <span class="copied-toast" id="copied-toast">Copied!</span>
    </div>
  </div>
</div>
<div id="animate-view">
  <div class="logo">Let Me <span>Glean</span> That For You</div>
  <p class="subtitle" style="margin-bottom:2rem;">Just watch...</p>
  <div class="search-box-wrapper">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <div class="anim-search-box" id="anim-text"><span id="cursor-blink"></span></div>
  </div>
  <button class="anim-btn" id="anim-btn">Search Glean</button>
  <div id="snark"></div>
</div>
<svg id="fake-cursor" viewBox="0 0 24 24"><path d="M4 1 L4 18 L9 13 L15 22 L18 20 L12 12 L19 12 Z" fill="#333" stroke="#fff" stroke-width="1"/></svg>
<div class="footer">LMGTFY, but for Glean</div>
<script>
(function () {
  var SNARK_MESSAGES = ["Was that so hard?","You could've just searched Glean yourself...","See? Glean knows things. Try it sometime.","Magic, right? It's called a search bar.","Next time, maybe try this yourself first?","Glean: it's like asking a colleague, but faster."];
  var params = new URLSearchParams(window.location.search);
  var animQuery = params.get('q');
  if (animQuery) { startAnimation(animQuery); } else { document.getElementById('create-view').style.display='block'; setupCreateView(); }
  function setupCreateView() {
    var input=document.getElementById('query-input'),btn=document.getElementById('generate-btn'),linkOutput=document.getElementById('link-output'),linkField=document.getElementById('generated-link'),copyBtn=document.getElementById('copy-btn'),toast=document.getElementById('copied-toast');
    input.addEventListener('keydown',function(e){if(e.key==='Enter')btn.click();});
    btn.addEventListener('click',function(){var q=input.value.trim();if(!q){input.focus();return;}var url=window.location.origin+window.location.pathname+'?q='+encodeURIComponent(q);linkField.value=url;linkOutput.style.display='block';linkField.select();});
    copyBtn.addEventListener('click',function(){navigator.clipboard.writeText(linkField.value).then(function(){toast.style.display='inline';setTimeout(function(){toast.style.display='none';},2000);});});
  }
  function startAnimation(query) {
    document.getElementById('create-view').style.display='none';document.getElementById('animate-view').style.display='block';
    var textEl=document.getElementById('anim-text'),cursorEl=document.getElementById('cursor-blink'),btnEl=document.getElementById('anim-btn'),snarkEl=document.getElementById('snark'),fakeCursor=document.getElementById('fake-cursor');
    var i=0,delay=85;
    setTimeout(function(){textEl.classList.add('typing');var typeInterval=setInterval(function(){if(i<query.length){cursorEl.insertAdjacentText('beforebegin',query[i]);i++;}else{clearInterval(typeInterval);setTimeout(function(){animateClick(btnEl,fakeCursor,snarkEl,query);},600);}},delay);},800);
  }
  function animateClick(btnEl,fakeCursor,snarkEl,query) {
    var rect=btnEl.getBoundingClientRect(),targetX=rect.left+rect.width/2-4,targetY=rect.top+rect.height/2-2;
    fakeCursor.style.left=(window.innerWidth*0.65)+'px';fakeCursor.style.top=(window.innerHeight*0.25)+'px';fakeCursor.style.display='block';
    requestAnimationFrame(function(){fakeCursor.style.left=targetX+'px';fakeCursor.style.top=targetY+'px';});
    setTimeout(function(){btnEl.classList.add('active');fakeCursor.style.display='none';setTimeout(function(){var msg=SNARK_MESSAGES[Math.floor(Math.random()*SNARK_MESSAGES.length)];snarkEl.textContent=msg;snarkEl.style.display='block';setTimeout(function(){window.location.href='https://app.glean.com/search?q='+encodeURIComponent(query);},2500);},500);},750);
  }
})();
</script>
</body>
</html>
